# REQUIRES: webassembly

# The global index of an export counts imported globals. If the import section
# fails to parse, the index cannot be mapped to a global of the module, so the
# export gets no data symbol.

# yaml2obj cannot write an invalid import, so the kind of the import (global,
# 0x03) is patched to an unknown kind afterwards.
# RUN: yaml2obj %s -o %t.wasm
# RUN: %python -c "import sys; p = sys.argv[1]; d = open(p, 'rb').read(); open(p, 'wb').write(d.replace(b'bad_kind\x03', b'bad_kind\x09', 1))" %t.wasm
# RUN: %lldb %t.wasm -o "target modules dump symtab" -o exit 2>&1 \
# RUN:   | FileCheck %s --implicit-check-not=g_data

# CHECK: Dumping symbol table

--- !WASM
FileHeader:
  Version: 0x1
Sections:
  - Type: IMPORT
    Imports:
      - Module: env
        Field: bad_kind
        Kind: GLOBAL
        GlobalType: I32
        GlobalMutable: false
  - Type: MEMORY
    Memories:
      - Minimum: 0x1
  - Type: GLOBAL
    Globals:
      - Index: 1
        Type: I32
        Mutable: false
        InitExpr:
          Opcode: I32_CONST
          Value: 1024
      # Where the export would point if the import were not counted.
      - Index: 2
        Type: I32
        Mutable: false
        InitExpr:
          Opcode: I32_CONST
          Value: 1028
  - Type: EXPORT
    Exports:
      - Name: g_data
        Kind: GLOBAL
        Index: 1
  - Type: DATA
    Segments:
      - SectionOffset: 6
        InitFlags: 0
        Offset:
          Opcode: I32_CONST
          Value: 1024
        Content: 'DEADBEEFCAFEF00D'
...
